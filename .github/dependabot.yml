# Dependabot: weekly npm / Actions / Docker base image updates.
#
# Policy: minor/patch arrive as grouped PRs. **All semver-major bumps are done
# manually, in one batch** (same as kibble: splitting major PRs scatters the
# compatibility fixes and verification, and creates "turn the bot off or bump
# everything at once" maintenance pressure).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      # The ignore above does not apply to security updates ("update-types only
      # affects version updates, not security updates", GitHub docs), so every
      # advisory would open its own semver-major PR. Group them so they arrive as
      # one batch, in line with the "majors in one branch" policy above.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Docker only follows tags, so a major could jump to a Current (odd, non-LTS) line.
  # Majors (e.g. 24 -> 25) are a manual decision; only minor/patch (security/bug fixes) are proposed.
  # chirp has a single image, so only the root Dockerfile is watched (kibble has apps/api and apps/web).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
