name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root devDependencies are excluded. A workspace devDependency that is reachable
      # from the production tree still ships in the tarball/image and is still flagged;
      # fix those by pinning a patched version via overrides in the root package.json.
      - name: Audit dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      # Same packaging as release.yml, then start the server from the unpacked tarball.
      - name: Package and smoke-test a release tarball
        run: |
          npm prune --omit=dev
          bash scripts/package-release.sh "$RUNNER_TEMP/chirp"
          tar -czf "$RUNNER_TEMP/chirp-ci.tar.gz" -C "$RUNNER_TEMP/chirp" .
          bash scripts/ci/smoke-release.sh "$RUNNER_TEMP/chirp-ci.tar.gz"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run Tests
        run: npm run test

  proxmox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Proxmox install/update scripts
        run: bash scripts/ci/check-proxmox.sh
