name: Release

# When a GitHub Release is published, build chirp-<version>.tar.gz (+ .sha256) and attach it.
# The Proxmox install/update scripts download this asset (pure JS, no native dependencies).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          for f in package.json packages/shared/package.json apps/server/package.json apps/web/package.json; do
            PKG="$(node -p "require('./$f').version")"
            if [ "$PKG" != "$VERSION" ]; then
              echo "::error::tag '$TAG' does not match $f version '$PKG'"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # Includes nested workspace node_modules (apps/*/node_modules, packages/*/node_modules).
      - name: Create tarball
        run: |
          bash scripts/package-release.sh "$RUNNER_TEMP/chirp"
          tar -czf "chirp-${VERSION}.tar.gz" -C "$RUNNER_TEMP/chirp" .
          sha256sum "chirp-${VERSION}.tar.gz" > "chirp-${VERSION}.tar.gz.sha256"
          cat "chirp-${VERSION}.tar.gz.sha256"

      # Unpack the tarball outside the checkout and start it: every import must resolve from the tarball alone.
      - name: Smoke-test the tarball
        run: bash scripts/ci/smoke-release.sh "chirp-${VERSION}.tar.gz"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "chirp-${VERSION}.tar.gz" "chirp-${VERSION}.tar.gz.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
