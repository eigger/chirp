name: Release

# GitHub Release 가 published 되면 chirp-<version>.tar.gz(+ .sha256)을 빌드해 릴리스에 올린다.
# Proxmox 설치/업데이트 스크립트가 이 자산을 받는다 (순수 JS, 네이티브 의존성 없음).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          for f in package.json packages/shared/package.json apps/server/package.json apps/web/package.json; do
            PKG="$(node -p "require('./$f').version")"
            if [ "$PKG" != "$VERSION" ]; then
              echo "::error::tag '$TAG' does not match $f version '$PKG'"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Create tarball
        run: |
          tar -czf "chirp-${VERSION}.tar.gz" \
            package.json \
            node_modules \
            packages/shared/package.json packages/shared/dist \
            apps/server/package.json apps/server/dist \
            apps/web/dist
          sha256sum "chirp-${VERSION}.tar.gz" > "chirp-${VERSION}.tar.gz.sha256"
          cat "chirp-${VERSION}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "chirp-${VERSION}.tar.gz" "chirp-${VERSION}.tar.gz.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
